<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Master icon. Everything meaningful sits inside the centre 80% so the
       maskable variant survives Android's circle crop. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Streak ring: deliberately open at the top-right. A closed circle reads as
       "finished"; the gap reads as "keep going". -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#334155" stroke-width="26"/>
  <path d="M 256 106 A 150 150 0 1 0 362 150"
        fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"/>

  <!-- Tick -->
  <path d="M 186 258 L 236 308 L 330 208"
        fill="none" stroke="#f8fafc" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
